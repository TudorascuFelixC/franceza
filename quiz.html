<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de franceză</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f4f8; --card:#ffffff; --ink:#1c2233; --muted:#5d6579; --line:#d9dce6;
  --accent:#2a4fb0; --accent-ink:#ffffff; --soft:#e6ebf8; --warn:#b4531b; --ok:#23794a;
  --ok-bg:#e3f3ea; --bad:#b3261e; --bad-bg:#fbe7e5;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --card:#1b1f2a; --ink:#e9ecf4; --muted:#9aa2b6; --line:#2d3342;
    --accent:#7c9cff; --accent-ink:#0e1220; --soft:#232a3d; --warn:#f0a36a; --ok:#6fd49a;
    --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151d; --card:#1b1f2a; --ink:#e9ecf4; --muted:#9aa2b6; --line:#2d3342;
  --accent:#7c9cff; --accent-ink:#0e1220; --soft:#232a3d; --warn:#f0a36a; --ok:#6fd49a;
  --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:16px 32px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 1.35rem/1.2 Literata,Georgia,serif;margin:0;text-wrap:balance}
h2{font:700 1.05rem/1.3 "Source Sans 3",system-ui,sans-serif;margin:0}
a.back{color:var(--accent);font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
a.back:hover{border-color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tool{border:none;background:none;color:var(--accent);font:inherit;font-size:.88rem;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.seg button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button span{font-weight:400;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.qkind{font-size:.9rem;color:var(--muted)}
.prompt{font:700 clamp(1.4rem,5vw,2rem)/1.25 Literata,Georgia,serif;overflow-wrap:anywhere;text-wrap:balance}
.prompt.sent{font-size:clamp(1.15rem,4vw,1.45rem);font-weight:500}
.prompt .blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:var(--accent)}
.hintline{color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;min-height:48px}
.opt kbd{font:600 .8rem/1.6 "Source Sans 3",sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
input.answer{width:100%;font:500 1.15rem/1.4 "Source Sans 3",system-ui,sans-serif;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input.answer.right{border-color:var(--ok);background:var(--ok-bg)}
input.answer.wrong{border-color:var(--bad);background:var(--bad-bg)}
.accents{display:flex;flex-wrap:wrap;gap:4px}
.accents button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;min-width:34px;height:34px;font:inherit;cursor:pointer}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.right{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.wrong{background:var(--bad-bg);border:1px solid var(--bad)}
.fb strong.v{font-size:1.05rem}
.fb.right strong.v{color:var(--ok)}
.fb.wrong strong.v{color:var(--bad)}
.fb .ex{font-size:.92rem;color:var(--muted)}
.fb .ex b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.big{display:flex;align-items:baseline;gap:10px}
.big b{font:700 2.6rem/1 Literata,Georgia,serif;font-variant-numeric:tabular-nums}
.mist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.mist li{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.mist .yours{color:var(--bad)}
.mist .good{color:var(--ok);font-weight:600}
footer{color:var(--muted);font-size:.82rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Teste de franceză</h1>
    <div class="row"><a class="back" href="cest-il-est.html">C'est / il est / il y a</a><a class="back" href="index.html">← Cartonașe</a></div>
  </header>

  <!-- setup -->
  <section class="panel" id="setup">
    <div class="row" style="justify-content:space-between">
      <h2>1. Alege categoriile</h2>
      <div class="row">
        <button class="tool" id="allBtn" type="button">Toate</button>
        <button class="tool" id="noneBtn" type="button">Niciuna</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>

    <h2>2. Cum răspunzi</h2>
    <div class="seg" id="modeSeg">
      <button type="button" data-mode="mc">4 variante<span>Alegi răspunsul corect</span></button>
      <button type="button" data-mode="type">Scriu eu<span>Tastezi răspunsul</span></button>
    </div>

    <h2>3. Câte întrebări</h2>
    <div class="seg" id="lenSeg">
      <button type="button" data-len="10">10</button>
      <button type="button" data-len="20">20</button>
      <button type="button" data-len="50">50</button>
    </div>

    <p class="muted small" id="setupInfo" style="margin:0"></p>
    <button class="btn primary" id="startBtn" type="button">Începe testul</button>
  </section>

  <!-- question -->
  <section class="panel" id="quiz" hidden>
    <div class="qmeta"><span id="qCount"></span><span id="qScore"></span></div>
    <div class="progress"><i id="qBar"></i></div>
    <div class="qkind" id="qKind"></div>
    <div class="prompt" id="qPrompt"></div>
    <div class="hintline" id="qHint"></div>
    <div class="opts" id="qOpts"></div>
    <div id="qTypeBox" hidden>
      <input class="answer" id="qInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Răspunsul tău">
      <div class="accents" id="accents" style="margin-top:8px"></div>
    </div>
    <div id="qFb"></div>
    <div class="actions">
      <button class="btn" id="skipBtn" type="button">Nu știu</button>
      <button class="btn primary" id="goBtn" type="button">Verifică</button>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="tool" id="quitBtn" type="button">Oprește testul</button></div>
  </section>

  <!-- results -->
  <section class="panel" id="result" hidden>
    <h2>Rezultat</h2>
    <div class="big"><b id="rScore"></b><span class="muted" id="rPct"></span></div>
    <p id="rMsg" style="margin:0"></p>
    <div class="actions">
      <button class="btn primary" id="retryWrongBtn" type="button">Reia greșelile</button>
      <button class="btn" id="againBtn" type="button">Test nou</button>
      <button class="btn" id="setupBtn" type="button">Alte categorii</button>
    </div>
    <div id="rListBox">
      <h2 style="margin-bottom:8px">Greșeli</h2>
      <ul class="mist" id="rList"></ul>
    </div>
  </section>

  <footer id="foot">Tastatură: 1–4 alegi varianta, Enter verifici și treci mai departe.</footer>
</div>

.","Abia văd."],["exactement","exact","C'est exactement ça.","Exact asta este."],["autrefois","altădată / pe vremuri","Les maisons d'autrefois sont belles.","Casele de altădată sunt frumoase."],["longtemps","mult timp","Tu restes longtemps ?","Rămâi mult timp?"],["tout à coup","dintr-odată","Tout à coup, il pleut.","Dintr-odată, plouă."],["vachement (familiar)","foarte / tare","C'est vachement bien !","E tare bine!"],["actuellement","în prezent","Actuellement, j'habite à Londres.","În prezent locuiesc la Londra."],["récemment","recent","Récemment, je lis beaucoup.","În ultima vreme citesc mult."],["avant (adverb)","înainte","Je mange avant, puis je sors.","Mănânc înainte, apoi ies."],["après (adverb)","după aceea","Je travaille, et après je me repose.","Lucrez, iar după aceea mă odihnesc."],["immédiatement","imediat","Je réponds immédiatement.","Răspund imediat."],["nulle part","nicăieri","Je ne vois mon chat nulle part.","Nu-mi văd pisica nicăieri."],["quelque part","undeva","Mes clés sont quelque part ici.","Cheile mele sunt undeva pe aici."],["dessus","deasupra / pe el","Voici la table, le livre est dessus.","Iată masa, cartea este pe ea."],["dessous","dedesubt / sub el","Voici le lit, le chat dort dessous.","Iată patul, pisica doarme dedesubt."],["autour","în jur","Il y a une maison et un jardin autour.","Este o casă și o grădină în jur."],["rapidement","rapid","Il répond rapidement.","El răspunde rapid."],["difficilement","cu greu / cu dificultate","Je respire difficilement.","Respir cu greu."],["fortement","puternic / tare","Il pleut fortement.","Plouă puternic."],["correctement","corect","Tu écris correctement.","Tu scrii corect."],["simplement","simplu","Il explique simplement.","El explică simplu."],["clairement","clar","Elle parle clairement.","Ea vorbește clar."],["sérieusement","serios","Tu travailles sérieusement.","Tu lucrezi serios."],["autrement","altfel","Je fais autrement.","Eu fac altfel."],["volontairement","intenționat / voluntar","Il arrive en retard volontairement.","El întârzie intenționat."],["accidentellement","accidental / din greșeală","Je supprime le fichier accidentellement.","Șterg fișierul din greșeală."],["davantage","mai mult","Je veux travailler davantage.","Vreau să muncesc mai mult."],["autant","la fel de mult / atât","Je travaille autant que toi.","Muncesc la fel de mult ca tine."],["complètement","complet / cu totul","Je suis complètement d'accord.","Sunt complet de acord."],["totalement","total","C'est totalement différent.","Este total diferit."],["absolument","absolut","C'est absolument vrai.","Este absolut adevărat."],["suffisamment","suficient","Tu dors suffisamment ?","Dormi suficient?"],["énormément","enorm de mult","Il travaille énormément.","El muncește enorm de mult."]]},{"id":"conj","name":"Conjuncții și conectori","cards":[["et","și","Je mange du pain et du fromage.","Mănânc pâine și brânză."],["ou","sau","Tu veux du thé ou du café ?","Vrei ceai sau cafea?"],["mais","dar","Je suis fatigué, mais content.","Sunt obosit, dar mulțumit."],["donc","deci","Je pense, donc je suis.","Gândesc, deci exist."],["or","or / însă","Il veut partir, or il pleut.","Vrea să plece, însă plouă."],["ni … ni","nici … nici","Je n'aime ni le thé ni le café.","Nu-mi place nici ceaiul, nici cafeaua."],["car","căci / pentru că","Je reste, car il pleut.","Rămân, căci plouă."],["parce que","pentru că","Je mange parce que j'ai faim.","Mănânc pentru că mi-e foame."],["puisque","din moment ce / fiindcă","Puisque tu es là, on commence.","Din moment ce ești aici, începem."],["comme (cauză)","întrucât / cum","Comme il fait beau, je sors.","Cum e vreme frumoasă, ies."],["que","că","Je sais que tu as raison.","Știu că ai dreptate."],["si","dacă","Si tu veux, on sort.","Dacă vrei, ieșim."],["quand","când","Quand il pleut, je reste chez moi.","Când plouă, stau acasă."],["lorsque","atunci când","Lorsque je suis fatigué, je dors.","Atunci când sunt obosit, dorm."],["pendant que","în timp ce","Je lis pendant que tu cuisines.","Eu citesc în timp ce tu gătești."],["alors que","în timp ce / deși","Il travaille alors que je me repose.","El muncește în timp ce eu mă odihnesc."],["tandis que","pe când / în timp ce","Elle chante tandis qu'il danse.","Ea cântă pe când el dansează."],["dès que","îndată ce","Je t'appelle dès que j'arrive.","Te sun îndată ce ajung."],["depuis que","de când","Depuis qu'il habite ici, il est heureux.","De când locuiește aici, e fericit."],["avant que (+ subjonctif)","înainte ca","Je pars avant qu'il pleuve.","Plec înainte să plouă."],["pour que (+ subjonctif)","pentru ca / ca să","Je parle lentement pour que tu comprennes.","Vorbesc rar ca să înțelegi."],["bien que (+ subjonctif)","deși","Bien qu'il soit malade, il travaille.","Deși e bolnav, lucrează."],["même si","chiar dacă","Je sors même s'il pleut.","Ies chiar dacă plouă."],["alors","atunci / deci","Il pleut, alors je prends un parapluie.","Plouă, deci iau o umbrelă."],["ensuite","apoi","Je travaille, ensuite je rentre.","Lucrez, apoi mă întorc acasă."],["puis","apoi / pe urmă","Je mange, puis je dors.","Mănânc, apoi dorm."],["d'abord","mai întâi","D'abord, on lit le texte.","Mai întâi, citim textul."],["enfin","în sfârșit / în final","Enfin, nous arrivons.","În sfârșit, ajungem."],["aussi (conector)","de asemenea / și","Je parle anglais et aussi français.","Vorbesc engleză și, de asemenea, franceză."],["pourtant","totuși","Il est riche, pourtant il n'est pas heureux.","E bogat, totuși nu e fericit."],["cependant","cu toate acestea","Le film est long ; cependant, il est intéressant.","Filmul e lung; cu toate acestea, e interesant."],["toutefois","totuși","C'est difficile, toutefois c'est possible.","E greu, totuși e posibil."],["par contre","în schimb","J'aime le thé, par contre je déteste le café.","Îmi place ceaiul, în schimb detest cafeaua."],["en revanche","în schimb","Il est timide ; en revanche, sa sœur parle beaucoup.","El e timid; în schimb, sora lui vorbește mult."],["au contraire","dimpotrivă","Il n'est pas triste, au contraire !","Nu e trist, dimpotrivă!"],["c'est pourquoi","de aceea","Il est malade, c'est pourquoi il reste au lit.","E bolnav, de aceea stă în pat."],["par conséquent","prin urmare","Il neige ; par conséquent, l'école est fermée.","Ninge; prin urmare, școala e închisă."],["en effet","într-adevăr","Il est fatigué ; en effet, il travaille beaucoup.","E obosit; într-adevăr, muncește mult."],["c'est-à-dire","adică","Je viens demain, c'est-à-dire samedi.","Vin mâine, adică sâmbătă."],["par exemple","de exemplu","J'aime les fruits, par exemple les pommes.","Îmi plac fructele, de exemplu merele."],["en plus","în plus","Il est gentil et, en plus, il est drôle.","E drăguț și, în plus, e amuzant."],["de plus","mai mult / în plus","Le trajet est long ; de plus, il pleut.","Drumul e lung; în plus, plouă."],["d'ailleurs","de altfel","Je ne sors pas ; d'ailleurs, il fait froid.","Nu ies; de altfel, e frig."],["soit … soit","fie … fie","Soit tu viens, soit tu restes.","Fie vii, fie rămâi."],["non seulement … mais aussi","nu numai … ci și","Il parle non seulement français mais aussi italien.","Vorbește nu numai franceza, ci și italiana."],["en fait","de fapt","En fait, je suis d'accord.","De fapt, sunt de acord."],["bref","pe scurt","Bref, tout va bien.","Pe scurt, totul e bine."],["finalement","în cele din urmă","Finalement, nous choisissons la mer.","În cele din urmă, alegem marea."],["comme (comparație)","ca / precum","Il chante comme un oiseau.","Cântă ca o pasăre."],["ainsi que","precum și","J'invite Paul ainsi que sa femme.","Îl invit pe Paul, precum și pe soția lui."],["également","de asemenea","Je parle anglais et également français.","Vorbesc engleză și, de asemenea, franceză."],["après (succesiune)","după aceea","Je mange, et après je lis.","Mănânc, și după aceea citesc."],["à cause de","din cauza","Je reste à cause de la pluie.","Rămân din cauza ploii."],["grâce à","datorită","Je parle français grâce à mes cours.","Vorbesc franceză datorită cursurilor mele."],["à condition que (+ subjonctif)","cu condiția să","Je viens à condition que tu sois là.","Vin cu condiția să fii acolo."],["sauf si","exceptând cazul în care / doar dacă nu","Je sors, sauf s'il pleut.","Ies, doar dacă nu plouă."],["notamment","în special / mai ales","J'aime les sports, notamment le tennis.","Îmi plac sporturile, în special tenisul."]]},{"id":"neg","name":"Negația","cards":[["ne … pas","nu","Je ne parle pas allemand.","Nu vorbesc germana."],["ne … plus","nu mai","Il ne fume plus.","El nu mai fumează."],["ne … jamais","niciodată","Je ne bois jamais d'alcool.","Nu beau niciodată alcool."],["ne … rien","nimic","Je ne comprends rien.","Nu înțeleg nimic."],["ne … personne","pe nimeni","Je ne vois personne.","Nu văd pe nimeni."],["personne ne …","nimeni nu","Personne ne sait la réponse.","Nimeni nu știe răspunsul."],["rien ne …","nimic nu","Rien ne change.","Nimic nu se schimbă."],["ne … aucun(e)","niciun / nicio","Je n'ai aucune idée.","Nu am nicio idee."],["ne … ni … ni","nici … nici","Il ne mange ni viande ni poisson.","Nu mănâncă nici carne, nici pește."],["ne … que","doar / numai","Je n'ai que dix euros.","Am doar zece euro."],["ne … pas encore","încă nu","Il n'est pas encore là.","Încă nu a venit."],["ne … nulle part","nicăieri","Je ne trouve mes clés nulle part.","Nu-mi găsesc cheile nicăieri."],["ne … guère","abia / aproape deloc","Il ne mange guère.","Aproape că nu mănâncă."],["ne … pas du tout","deloc","Je n'aime pas du tout ça.","Nu-mi place deloc asta."],["ne … pas non plus","nici (eu) nu","Je ne viens pas non plus.","Nici eu nu vin."],["moi non plus","nici eu","Je n'aime pas le froid. – Moi non plus.","Nu-mi place frigul. – Nici mie."],["pas de / pas d'","niciun / deloc (în loc de un, une, des)","Il n'y a pas de pain.","Nu este pâine."],["non","nu","Tu as faim ? – Non.","Ți-e foame? – Nu."],["pas (familiar, fără ne)","nu (vorbire familiară)","Je sais pas.","Nu știu."],["ne pas + infinitiv","a nu (face ceva)","Je préfère ne pas e o sută de grame de unt."],["un litre de","un litru de","Je bois un litre d'eau par jour.","Beau un litru de apă pe zi."],["une bouteille de","o sticlă de","Nous achetons une bouteille de vin.","Cumpărăm o sticlă de vin."],["un verre de","un pahar de","Je veux un verre d'eau.","Vreau un pahar cu apă."],["une tasse de","o ceașcă de","Je bois une tasse de thé.","Beau o ceașcă de ceai."],["un morceau de","o bucată de","Tu veux un morceau de gâteau ?","Vrei o bucată de prăjitură?"],["une tranche de","o felie de","Je mange une tranche de jambon.","Mănânc o felie de șuncă."],["un paquet de","un pachet de","J'achète un paquet de café.","Cumpăr un pachet de cafea."],["une boîte de","o cutie de","Il y a une boîte de chocolats.","Este o cutie de bomboane."],["une douzaine de","o duzină de","Je prends une douzaine d'œufs.","Iau o duzină de ouă."],["une part de","o porție / o parte de","Je voudrais une part de pizza.","Aș vrea o felie de pizza."],["une pincée de","un vârf de cuțit de","Ajoute une pincée de sel.","Adaugă un vârf de cuțit de sare."],["la plupart de","majoritatea","La plupart des gens travaillent.","Majoritatea oamenilor lucrează."],["quelques","câțiva / câteva","J'ai quelques amis ici.","Am câțiva prieteni aici."],["plusieurs","mai mulți / mai multe","Il a plusieurs voitures.","Are mai multe mașini."],["chaque","fiecare","Chaque enfant a un cadeau.","Fiecare copil are un cadou."],["tout le / toute la","tot / toată","Il mange tout le gâteau.","Mănâncă toată prăjitura."],["tous les / toutes les","toți / toate","Toutes les boutiques sont fermées.","Toate magazinele sunt închise."],["aucun / aucune","niciun / nicio","Il n'a aucun problème.","Nu are nicio problemă."],["en (cantitate)","din asta / din ele","Tu as des pommes ? – Oui, j'en ai trois.","Ai mere? – Da, am trei."],["du / de la / des (partitiv)","niște / o cantitate de","Je bois du lait.","Beau lapte."],["le reste","restul","Je garde le reste pour demain.","Păstrez restul pentru mâine."],["presque","aproape","Le verre est presque vide.","Paharul este aproape gol."],["environ","aproximativ","Il y a environ vingt personnes.","Sunt aproximativ douăzeci de persoane."],["à peu près","cam / aproximativ","Ça coûte à peu près dix euros.","Costă cam zece euro."],["seulement","doar","J'ai seulement deux minutes.","Am doar două minute."],["beaucoup trop de","mult prea mult / mult prea mulți","Il y a beaucoup trop de bruit.","Este mult prea mult zgomot."],["peu de (exemplu)","puțin","J'ai peu de temps.","Am puțin timp."],["trop de (exemplu)","prea multe","J'ai trop de problèmes.","Am prea multe probleme."]]},{"id":"struct","name":"Structurile de propoziție","cards":[["Subiect + verb + complement","propoziția afirmativă de bază","Marie mange une pomme.","Marie mănâncă un măr."],["Subiect + ne + verb + pas","propoziția negativă","Je ne mange pas de viande.","Nu mănânc carne."],["Est-ce que + propoziție ?","întrebare cu „est-ce que”","Est-ce que tu viens ce soir ?","Vii diseară?"],["Verb-subiect ? (inversiune)","întrebare formală","Aimez-vous le fromage ?","Vă place brânza?"],["Cuvânt interogativ + est-ce que","întrebare deschisă","Où est-ce que tu habites ?","Unde locuiești?"],["Il y a + substantiv","există / este / sunt","Il y a trois chambres.","Sunt trei camere."],["C'est + adjectiv / substantiv","este (prezentare)","C'est très beau.","Este foarte frumos."],["Ce sont + plural","sunt (prezentare plural)","Ce sont mes parents.","Aceștia sunt părinții mei."],["Voici / Voilà","iată / uite","Voici mon ami Paul.","Iată-l pe prietenul meu Paul."],["Il faut + infinitiv","trebuie să","Il faut travailler.","Trebuie să muncim."],["Verb + infinitiv","a vrea / a putea / a ști să …","Je veux apprendre le français.","Vreau să învăț franceza."],["aimer + infinitiv","a-i plăcea să","J'aime lire le soir.","Îmi place să citesc seara."],["aller + infinitiv","viitorul apropiat","Je vais manger.","Urmează să mănânc."],["venir de + infinitiv","trecutul recent (tocmai am …)","Je viens de manger.","Tocmai am mâncat."],["être en train de + infinitiv","a fi în curs de a face ceva","Il est en train de lire.","Citește chiar acum."],["Pronume complement + verb","pronumele stă înaintea verbului","Je le vois.","Îl văd."],["Pronume + verb + infinitiv","pronumele stă înaintea infinitivului","Je veux le voir.","Vreau să-l văd."],["Substantiv + adjectiv","adjectivul stă de obicei după substantiv","J'ai une voiture rouge.","Am o mașină roșie."],["BAGS: beau, âge, bon, taille + substantiv","adjective scurte stau înaintea substantivului","C'est une belle maison.","Este o casă frumoasă."],["Imperativ afirmativ","poruncă, fără subiect","Ferme la porte !","Închide ușa!"],["Imperativ negativ","interdicție","Ne parle pas !","Nu vorbi!"],["Propoziție + parce que + propoziție","cauza","Je reste parce qu'il pleut.","Rămân pentru că plouă."],["Si + prezent, prezent","condiție reală (în prezent)","Si tu veux, je t'aide.","Dacă vrei, te ajut."],["Propoziție + qui / que","propoziție relativă","C'est le livre que j'aime.","Este cartea care îmi place."],["Je pense que …","cred că …","Je pense que c'est vrai.","Cred că este adevărat."],["Verb reflexiv","pronume reflexiv + verb","Je m'appelle Felix.","Mă numesc Felix."],["C'est … qui / que (evidențiere)","punerea în evidență","C'est Paul qui paie.","Paul este cel care plătește."],["Il fait + vreme","descrierea vremii","Il fait beau aujourd'hui.","Azi e vreme frumoasă."],["Ça fait … que","de … (durată)","Ça fait deux ans que j'habite ici.","De doi ani locuiesc aici."],["depuis + durată","de (acțiune care continuă)","J'étudie depuis une heure.","Învăț de o oră."],["Je voudrais …","aș vrea … (politicos)","Je voudrais un café, s'il vous plaît.","Aș vrea o cafea, vă rog."],["avoir besoin de + substantiv","a avea nevoie de","J'ai besoin d'un stylo.","Am nevoie de un pix."],["Il est + oră","ora","Il est midi.","Este ora douăsprezece."],["Quel + substantiv !","exclamație","Quelle belle journée !","Ce zi frumoasă!"],["SUBIECT + VERB","fraza simplă","Je travaille.","Lucrez."],["SUBIECT + VERB + OBIECT","fraza cu obiect","Je regarde un film.","Mă uit la un film."],["… + LOC","fraza cu loc","Je regarde un film à la maison.","Mă uit la un film acasă."],["… + LOC + TIMP","fraza cu loc și timp","Je regarde un film à la maison ce soir.","Mă uit la un film acasă diseară."],["… + parce que + propoziție","fraza cu motiv","Je reste à la maison parce que je suis fatigué.","Rămân acasă pentru că sunt obosit."],["… mais …","fraza cu contrast","Je suis fatigué, mais je travaille.","Sunt obosit, dar lucrez."],["… donc …","fraza cu consecință","Je suis fatigué, donc je vais dormir.","Sunt obosit, deci o să mă culc."],["verb + adverb (beaucoup)","adverbul stă după verb","Je travaille beaucoup.","Lucrez mult."],["verb + adverb + complement (souvent)","adverbul stă între verb și complement","Je parle souvent français.","Vorbesc des franceza."],["verb + toujours + loc","adverbul de frecvență după verb","Je vais toujours au travail.","Merg mereu la muncă."],["ne + verb + jamais + timp","negația cu adverb de timp","Je ne travaille jamais le dimanche.","Nu lucrez niciodată duminica."]]},{"id":"cest","name":"C'est / Il est / Il y a","cards":[["c'est","este / asta e / el e (+ un, une, le, mon…)","C'est mon frère.","El e fratele meu."],["ce sont","sunt / aceștia sunt (+ des, les, mes…)","Ce sont mes amis.","Ei sunt prietenii mei."],["il est","el este (+ adjectiv / meserie fără articol)","Il est médecin.","El este medic."],["elle est","ea este (+ adjectiv / meserie fără articol)","Elle est très gentille.","Ea este foarte drăguță."],["ils sont","ei sunt (+ adjectiv)","Ils sont fatigués.","Ei sunt obosiți."],["elles sont","ele sunt (+ adjectiv)","Elles sont contentes.","Ele sunt mulțumite."],["il y a","există / este / sunt (ceva undeva)","Il y a un chat sous la table.","Este o pisică sub masă."],["il n'y a pas de","nu există / nu este (niciun)","Il n'y a pas de pain.","Nu este pâine."],["ce n'est pas","nu este / nu e","Ce n'est pas mon sac."," tiv","J'aime le français. J'aime la musique.","Îmi place franceza. Îmi place muzica."],["J'aime + infinitiv","Îmi place să …","J'aime voyager. J'aime apprendre.","Îmi place să călătoresc. Îmi place să învăț."],["Je pense que + propoziție","Cred că + propoziție","Je pense que c'est important.","Cred că este important."],["Je veux que + propoziție (subjonctif)","Vreau ca + propoziție","Je veux que tu viennes.","Vreau să vii."]]},{"id":"timpuri","name":"Timpurile verbale","cards":[["1. Présent","prezent","Je travaille.","Muncesc."],["2. Passé composé","trecut (perfect compus)","J'ai travaillé.","Am muncit."],["3. Futur proche","viitor apropiat","Je vais travailler.","O să muncesc."],["4. Imparfait","imperfect","Je travaillais.","Munceam."],["5. Futur simple","viitor","Je travaillerai.","Voi munci."],["6. Conditionnel","condițional","Je travaillerais.","Aș munci."],["7. Plus-que-parfait","mai mult ca perfect","J'avais travaillé.","Muncisem."]]},{"id":"aux","name":"Verbe auxiliare și modale","cards":[["je peux (pouvoir)","pot","Je peux venir demain.","Pot să vin mâine."],["je veux (vouloir)","vreau","Je veux un café.","Vreau o cafea."],["je dois (devoir)","trebuie să","Je dois partir.","Trebuie să plec."],["je sais (savoir)","știu","Je sais nager.","Știu să înot."],["il faut (falloir)","trebuie","Il faut dormir.","Trebuie să dormi."],["j'espère (espérer)","sper","J'espère que tu vas bien.","Sper că ești bine."],["j'aime (aimer)","îmi place","J'aime lire.","Îmi place să citesc."],["je préfère (préférer)","prefer","Je préfère le thé.","Prefer ceaiul."],["je pense (penser)","cred / gândesc","Je pense à toi.","Mă gândesc la tine."],["je crois (croire)","cred","Je crois que c'est vrai.","Cred că este adevărat."]]},{"id":"dialog","name":"Dialog: mă prezint","cards":[["Comment tu t'appelles ?","Cum te numești?","Je m'appelle Felix.","Mă numesc Felix."],["Quel âge as-tu ?","Câți ani ai?","J'ai trente-trois ans.","Am treizeci și trei de ani."],["Où est-ce que tu habites ?","Unde locuiești?","J'habite à Londres, au Royaume-Uni.","Locuiesc la Londra, în Regatul Unit."],["Qu'est-ce que tu fais dans la vie ?","Cu ce te ocupi?","Je travaille et j'étudie aussi.","Lucrez și, de asemenea, studiez."],["Qu'est-ce que tu aimes apprendre ?","Ce îți place să înveți?","J'aime apprendre de nouvelles choses et je m'intéresse beaucoup à la technologie et à l'informatique.","Îmi place să învăț lucruri noi și sunt foarte interesat de tehnologie și informatică."],["À quelle heure tu te réveilles le matin ?","La ce oră te trezești dimineața?","Le matin, je me réveille à sept heures.","Dimineața mă trezesc la ora șapte."],["Qu'est-ce que tu fais après ton réveil ?","Ce faci după ce te trezești?","Je me lève, je prends une douche et je prends mon petit-déjeuner.","Mă ridic, fac un duș și iau micul dejun."],["À quelle heure tu commences ta journée ?","La ce oră îți începi ziua?","À huit heures et quart, je commence ma journée.","La opt și un sfert îmi încep ziua."],["Qu'est-ce que tu fais à midi ?","Ce faci la prânz?","À midi, je prends mon déjeuner et je fais une petite pause.","La prânz iau masa și fac o mică pauză."],["Où est-ce que tu manges le midi ?","Unde mănânci la prânz?","Parfois, je mange à la maison et parfois, je vais au restaurant.","Uneori mănânc acasă și uneori merg la restaurant."],["Quelle heure est-il à midi moins le quart ?","Cât este ora la douăsprezece fără un sfert?","À midi moins le quart, il est onze heures quarante-cinq.","La douăsprezece fără un sfert este ora 11:45."],["Qu'est-ce que tu fais l'après-midi ?","Ce faci după-amiaza?","L'après-midi, je travaille et j'étudie.","După-amiaza lucrez și studiez."],["À quelle heure tu prends une pause ?","La ce oră iei o pauză?","À trois heures et demie, je prends une petite pause.","La trei și jumătate fac o mică pauză."],["À quelle heure tu termines généralement ton travail ?","La ce oră termini de obicei munca?","À cinq heures, je termine généralement mon travail.","La ora cinci termin de obicei munca."],["Qu'est-ce que tu fais le soir ?","Ce faci seara?","Le soir, je rentre chez moi. Je prépare le dîner et je regarde parfois un film ou une série.","Seara mă întorc acasă. Pregătesc cina și uneori mă uit la un film sau la un serial."],["À quelle heure tu dînes ?","La ce oră iei cina?","À huit heures et demie, je dîne.","La opt și jumătate iau cina."],["Qu'est-ce que tu fais après le dîner ?","Ce faci după cină?","Ensuite, j'écoute de la musique ou je joue aux jeux vidéo.","Apoi ascult muzică sau mă joc jocuri video."],["À quelle heure tu vas te coucher ?","La ce oră te culci?","La nuit, je vais me coucher vers onze heures et demie.","Noaptea mă culc în jurul orei unsprezece și jumătate."],["Que fais-tu quand tu es fatigué ?","Ce faci când ești obosit?","Quand je suis fatigué, je dors rapidement.","Când sunt obosit, adorm repede."],["Quel temps fait-il aujourd'hui ?","Cum este vremea azi?","Aujourd'hui, il fait beau et il y a du soleil.","Azi este vreme frumoasă și este soare."],["Est-ce qu'il fait chaud aujourd'hui ?","Este cald azi?","Oui, il fait assez chaud, mais il y a un peu de vent.","Da, este destul de cald, dar bate puțin vântul."],["Quel temps fait-il quand il pleut ?","Cum este vremea când plouă?","Quand il pleut, le temps est gris.","Când plouă, vremea este mohorâtă."],["Quel temps fait-il en hiver ?","Cum este vremea iarna?","En hiver, il fait froid et il fait souvent mauvais.","Iarna este frig și des este vreme urâtă."],["Qu'est-ce que tu aimes faire quand il fait beau ?","Ce îți place să faci când este frumos afară?","Quand il fait beau, j'aime sortir et me promener.","Când este frumos afară, îmi place să ies și să mă plimb."],["Qu'est-ce que tu fais quand il pleut ?","Ce faci când plouă?","Quand il pleut, je préfère rester à la maison et regarder un film.","Când plouă, prefer să rămân acasă și să mă uit la un film."],["Quelles langues parles-tu ?","Ce limbi vorbești?","Je parle roumain et anglais, et j'apprends le français.","Vorbesc română și engleză și învăț franceza."],["Est-ce que tu comprends le français ?","Înțelegi franceza?","Je comprends un peu le français, mais je veux parler mieux et faire des phrases plus facilement.","Înțeleg puțin franceza, dar vreau să vorbesc mai bine și să fac propoziții mai ușor."],["Pourquoi est-ce que tu apprends le français ?","De ce înveți franceza?","Je veux apprendre le français parce que j'aime la langue et je veux pouvoir parler avec des personnes francophones.","Vreau să învăț franceza pentru că îmi place limba și vreau să pot vorbi cu persoane francofone."],["Est-ce que le français est facile pour toi ?","Este franceza ușoară pentru tine?","Je sais que ce n'est pas toujours facile, mais je continue à apprendre tous les jours.","Știu că nu este întotdeauna ușor, dar continui să învăț în fiecare zi."]]},{"id":"lita","name":"Cuvinte A","cards":[["l'abeille (f)","albina","L'abeille fait du miel.","Albina face miere."],["l'accident (m)","accidentul","L'accident bloque la route.","Accidentul blochează drumul."],["accepter","a accepta","J'accepte ton invitation.","Accept invitația ta.","er"],["l'accord (m)","acordul / învoiala","Nous sommes d'accord, l'accord est simple.","Suntem de acord, acordul este simplu."],["accompagner","a însoți","J'accompagne ma fille à l'école.","O însoțesc pe fiica mea la școală.","er"],["l'achat (m)","cumpărătura / achiziția","L'achat d'une maison coûte cher.","Cumpărarea unei case costă mult."],["l'acteur / l'actrice","actorul / actrița","L'acteur joue dans un nouveau film.","Actorul joacă într-un film nou."],["l'activité (f)","activitatea","Le sport est mon activité préférée.","Sportul este activitatea mea preferată."],["l'addition (f)","nota de plată (la restaurant)","L'addition, s'il vous plaît !","Nota de plată, vă rog!"],["admirer","a admira","J'admire la vue depuis la fenêtre.","Admir priveliștea de la fereastră.","er"],["l'adresse (f)","adresa","Quelle est ton adresse ?","Care este adresa ta?"],["l'adulte (m/f)","adultul","Le bi ,"Mon ami habite à Paris.","Prietenul meu locuiește la Paris."],["l'amitié (f)","prietenia","L'amitié est importante pour moi.","Prietenia este importantă pentru mine."],["l'amour (m)","dragostea","L'amour change la vie.","Dragostea schimbă viața."],["amoureux / amoureuse","îndrăgostit / îndrăgostită","Il est amoureux de sa voisine.","El este îndrăgostit de vecina lui."],["amusant / amusante","amuzant / amuzantă","Ce film est très amusant.","Acest film este foarte amuzant."],["l'ananas (m)","ananasul","L'ananas est bien mûr.","Ananasul este bine copt."],["anglais / anglaise","englez / engleză","Ma femme parle anglais.","Soția mea vorbește engleză."],["l'Angleterre (f)","Anglia","J'habite en Angleterre.","Locuiesc în Anglia."],["l'animal (m)","animalul","Le chien est mon animal préféré.","Câinele este animalul meu preferat."],["annuler","a anula","J'annule le rendez-vous.","Anulez întâlnirea.","er"],["l'annonce (f)","anunțul","Je lis une annonce pour un appartement.","Citesc un anunț pentru un apartament."],["l'appareil (m)","aparatul","Cet appareil ne marche pas.","Acest aparat nu funcționează."],["l'appartement (m)","apartamentul","L'appartement a trois pièces.","Apartamentul are trei camere."],["l'appel (m)","apelul / chemarea","J'attends un appel important.","Aștept un apel important."],["l'appétit (m)","pofta de mâncare","Bon appétit ! J'ai de l'appétit ce soir.","Poftă bună! Am poftă de mâncare în seara asta."],["apporter","a aduce","J'apporte un gâteau pour la fête.","Aduc un tort pentru petrecere.","er"],["apprécier","a aprecia","J'apprécie ton aide.","Apreciez ajutorul tău.","er"],["l'arbre (m)","copacul","L'arbre perd ses feuilles en automne.","Copacul își pierde frunzele toamna."],["l'architecte (m/f)","arhitectul","L'architecte dessine une maison.","Arhitectul desenează o casă."],["l'argent (m)","banii / argintul","Je n'ai pas assez d'argent.","Nu am destui bani."],["l'armoire (f)","dulapul (de haine)","Mes vêtements sont dans l'armoire.","Hainele mele su function verbForms(inf, spec){
  const base = inf.replace(/\s*\(.*\)$/, "");
  if (spec === "er") { const s = base.slice(0,-2); return [s+"e",s+"es",s+"e",s+"ons",s+"ez",s+"ent"]; }
  if (spec === "ir") { const s = base.slice(0,-2); return [s+"is",s+"is",s+"it",s+"issons",s+"issez",s+"issent"]; }
  if (spec === "re") { const s = base.slice(0,-2); return [s+"s",s+"s",s,s+"ons",s+"ez",s+"ent"]; }
  return spec.split(",").map(f => f.trim());
}

function norm(s){
  return String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/…/g, " ").replace(/[?!.,;:«»"“”()]+/g, " ").replace(/\s+/g, " ").trim();
}
function alts(s, splitComma){
  const noPar = s.replace(/\([^)]*\)/g, " ");
  const parts = noPar.split(splitComma ? /[\/;,]/ : /[\/;]/).map(norm).filter(Boolean);
  const all = new Set(parts); all.add(norm(noPar)); all.add(norm(s));
  all.delete("");

}
function lev(a, b){
  if (Math.abs(a.length - b.length) > 1) return 2;
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
// returns "exact" | "accents" | "typo" | null
function judge(typed, accepted){
  const t = norm(typed); if (!t) return null;
  if (accepted.some(a => a === t)) return "exact";
  const td = deacc(t);
  if (accepted.some(a => deacc(a) === td)) return "accents";
  if (td.length >= 5 && accepted.some(a => lev(deacc(a), td) <= 1)) return "typo";
  return null;
}

const pick = a => a[Math.floor(Math.random() * a.length)];

const L = "a-zà-ÿœæ";
function findIn(sentence, word){
  const w = word.trim(); if (!w || w.length > 30) return null;
  const e = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
  const right = /'$/.test(w) ? "" : "(?![" + L + "])";
  const m = new RegExp("(^|[^" + L + "])(" + e + ")" + right, "i").exec(sentence);
  return m ? {start: m.index + m[1].length, text: m[2]} : null;
}

ici.", "Il n'est pas courir ici."], "blank": ["Il ne fait pas", "Il n'y a pas", "Il n'est pas"], "ro2fr": ["il ne fait pas", "il n'y a pas", "il n'est pas"]}, "cest-20": {"sent": ["Le français ? Elle est facile !", "Le français ? Ce sont faciles !", "Le français ? Il y a facile !"], "blank": ["Elle est facile", "Ce sont faciles", "Il y a facile"], "ro2fr": ["elle est facile", "ce sont faciles", "il y a facile"]}, "cest-21": {"sent": ["Tu ne viens pas ? Il est dommage.", "Tu ne viens pas ? Il y a dommage.", "Tu ne viens pas ? Il fait dommage."], "blank": ["Il est dommage", "Il y a dommage", "Il fait dommage"], "ro2fr": ["il est dommage", "il y a dommage", "il fait dommage"]}, "cest-22": {"sent": ["Elle est vraie, il a raison.", "Il y a vrai, il a raison.", "Ce sont vrais, il a raison."], "blank": ["Elle est vraie", "Il y a vrai", "Ce sont vrais"], "ro2fr": ["elle est vraie", "il y a vrai", "ce sont vrais"]}, "cest-23": {"sent": ["Il fait tard, je rentre.", "Il y a tard, je rentre.", "Elle est tard, je rentre."], "blank": ["Il fait tard", "Il y a tard", "Elle est tard"], "ro2fr": ["il fait tard", "il y a tard", "elle est tard"]}};

// ---------- question builders ----------
const HARD_CATS = new Set(["struct","formule","timpuri","dialog"]);   // long, phrase-like items
const KIND = {
  fr2ro: "Ce înseamnă în română?",
  ro2fr: "Cum se spune în franceză?",
  blank: "Completează propoziția",
  conj: "Conjugă verbul la prezent",
  sent: "Alege traducerea corectă a propoziției"
};

function makeQuestions(card, typing){
  const qs = [];
  const frA = alts(card.fr, false), roA = alts(card.ro, true);
  const shortFr = !HARD_CATS.has(card.cat) && !/\+/.test(card.fr) && frA.some(a => a.length <= 30);
  const shortRo = !HARD_CATS.has(card.cat) && roA.some(a => a.length <= 25);

  if (!typing || shortRo) qs.push({type: "fr2ro", card, prompt: card.fr, answer: card.ro, accept: roA});
  if (!typing || shortFr) qs.push({type: "ro2fr", card, prompt: card.ro, answer: card.fr, accept: frA});

  // fill in the blank
  let hit = null, blankAnswer = null, verbHint = "";
  if (card.conj) {
    const forms = verbForms(card.fr, card.conj);
    for (const f of [...new Set(forms)].sort((a, b) => b.length - a.length)) { hit = findIn(card.exFr, f); if (hit) break; }
    verbHint = card.fr.replace(/\s*\(.*\)$/, "");
  } else if (!HARD_CATS.has(card.cat)) {
    for (const raw of card.fr.replace(/\([^)]*\)/g, "").split("/").map(s => s.trim()).filter(Boolean)) {
      if (/…|\.\.\.|\+/.test(raw)) continue;
      hit = findIn(card.exFr, raw); if (hit) break;
    }
  }
  if (hit && hit.text.length < card.exFr.length * .8) {
    blankAnswer = hit.text;
    const before = card.exFr.slice(0, hit.start), after = card.exFr.slice(hit.start + hit.text.length);
    qs.push({type: "blank", card, before, after, verbHint, answer: blankAnswer, accept: [norm(blankAnswer)]});
  }

  // conjugation
  if (card.conj) {
    const forms = verbForms(card.fr, card.conj);
    const i = Math.floor(Math.random() * 6);
    const full = withPron(forms[i], i);
    qs.push({type: "conj", card, person: i, forms, answer: forms[i], full, accept: [norm(forms[i]), norm(full), norm(PRON[i] + " " + forms[i])]});
  }

  // translate the whole sentence (choice only)
  if (!typing) qs.push({type: "sent", card, prompt: card.exRo, answer: card.exFr, accept: [norm(card.exFr)]});
  // long phrases can't fairly be typed: those cards stay multiple choice even in typing mode
  if (typing && !qs.length) return makeQuestions(card, false).map(q => ({...q, forceMc: true}));
  return qs;
}

// Wrong options: prefer the same category, never something that would also be correct.
function distractors(q, pool){
  const alt = ALT[q.card.id] && ALT[q.card.id][q.type];
  if (alt) return shuffle(alt.slice());
  const out = [], seen = new Set(q.accept.map(deacc));
  seen.add(deacc(norm(q.answer)));
  const add = s => {
    if (out.length >= 3 || !s) return;
    const n = deacc(norm(s));
    const a = (q.type === "fr2ro" ? alts(s, true) : alts(s, false)).map(deacc);
    if (seen.has(n) || a.some(x => seen.has(x))) return;
    seen.add(n); out.push(s);
  };
  if (q.type === "conj") {
    shuffle(q.forms.map((f, i) => i)).forEach(i => add(q.forms[i]));
  }
  if (q.type === "blank" && q.card.conj) {
    shuffle(verbForms(q.card.fr, q.card.conj).slice()).forEach(add);
  }
  const field = {fr2ro: "ro", ro2fr: "fr", sent: "exFr", blank: "fr", conj: null}[q.type];
  const sameCat = shuffle(pool.filter(c => c.cat === q.card.cat && c !== q.card));
  const fromCard = c => {
    if (q.type === "conj" || (q.type === "blank" && c.conj)) {
      if (!c.conj) return null;
      const f = verbForms(c.fr, c.conj), person = q.type === "conj" ? q.person : Math.floor(Math.random() * 6);
      return f[person];
    }
    if (q.type === "blank") return c.fr.replace(/\([^)]*\)/g, "").split("/")[0].trim();
    return c[field];
  };
  for (const c of sameCat) { if (out.length >= 3) break; add(fromCard(c)); }
  for (const c of shuffle(CARDS.slice())) { if (out.length >= 3) break; if (q.type === "blank" && !q.card.conj && /…|\+/.test(c.fr)) continue; add(fromCard(c)); }
  return out;
}

function buildTest(cats, n, typing){
  const pool = CARDS.filter(c => cats.has(c.cat));
  const perCard = shuffle(pool.slice()).map(c => shuffle(makeQuestions(c, typing)));
  const list = [];
  // round-robin: first one question per card, then a second kind per card, and so on
  let round = 0, added = true;
  while (list.length < n && added) {
    added = false;
    for (const qs of perCard) { if (list.length >= n) break; if (qs[round]) { list.push(qs[round]); added = true; } }
    round++;
  }
  const test = shuffle(list);
  test.forEach(q => prepare(q, pool, typing));
  return test;
}
function prepare(q, pool, typing){
  q.mc = !typing || !!q.forceMc;
  if (!q.mc) { q.opts = null; return; }
  let ds = distractors(q, pool);
  // keep a capital letter consistent when the blank starts the sentence
  if (q.type === "blank" && /^[A-ZÀ-Ý]/.test(q.answer)) ds = ds.map(d => d.charAt(0).toUpperCase() + d.slice(1));
  q.opts = shuffle([q.answer, ...ds]);
}

// ---------- state ----------
const store = {
  get(k, d){ try { const v = localStorage.getItem("frquiz:" + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("frquiz:" + k, JSON.stringify(v)); } catch(e){} }
};
let selected = new Set(store.get("sel", []).filter(id => DATA.some(c => c.id === id)));
let mode = store.get("mode", "mc");
let len = store.get("len", 50);
let best = store.get("best", {});
let test = [], qi = 0, score = 0, answered = false, wrong = [];

const $ = id => document.getElementById(id);
function show(id){ ["setup","quiz","result"].forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); }

// ---------- setup ----------
function renderSetup(){
  $("chips").innerHTML = DATA.map(c => {
    const b = best[c.id];
    return '<button type="button" class="chip" data-id="' + c.id + '" aria-pressed="' + selected.has(c.id) + '">' + esc(c.name) +
      '<small>' + (b != null ? "record " + b + "%" : c.cards.length) + '</small></button>';
  }).join("");
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  document.querySelectorAll("#lenSeg button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.len === len));
  const cards = CARDS.filter(c => selected.has(c.cat)).length;
  $("startBtn").disabled = !selected.size;
  $("setupInfo").textContent = !selected.size ? "Alege cel puțin o categorie."
    : (selected.size === 1 ? "1 categorie" : selected.size + " categorii") + " · " + cards + " cartonașe · întrebări amestecate: traducere în ambele sensuri, propoziții de completat" +
      (CARDS.some(c => selected.has(c.cat) && c.conj) ? ", conjugări" : "") + (mode === "mc" ? ", traducerea exemplelor." : ".");
}
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const id = b.dataset.id; selected.has(id) ? selected.delete(id) : selected.add(id);
  store.set("sel", [...selected]); renderSetup();
});
$("allBtn").onclick = () => { selected = new Set(DATA.map(c => c.id)); store.set("sel", [...selected]); renderSetup(); };
$("noneBtn").onclick = () => { selected = new Set(); store.set("sel", []); renderSetup(); };
$("modeSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; mode = b.dataset.mode; store.set("mode", mode); renderSetup(); };
$("lenSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; len = +b.dataset.len; store.set("len", len); renderSetup(); };
$("startBtn").onclick = () => start(buildTest(selected, len, mode === "type"));

// ---------- running a test ----------
let lastTest = null;
function start(t){
  if (!t.length) return;
  test = t; lastTest = {cats: new Set(selected), len, mode}; qi = 0; score = 0; wrong = [];
  show("quiz"); renderQ();
}
function renderQ(){
  const q = test[qi]; answered = false;
  $("qCount").textContent = "Întrebarea " + (qi + 1) + " din " + test.length;
  $("qScore").textContent = "Corecte: " + score;
  $("qBar").style.width = (qi / test.length * 100) + "%";
  $("qKind").textContent = q.card.catName + " · " + KIND[q.type];
  const p = $("qPrompt"); p.className = "prompt"; p.removeAttribute("lang");
  let hint = "";
  if (q.type === "fr2ro") { p.textContent = q.prompt; p.lang = "fr"; }
  else if (q.type === "ro2fr") { p.textContent = q.prompt; }
  else if (q.type === "sent") { p.textContent = q.prompt; p.classList.add("sent"); }
  else if (q.type === "blank") {
    p.classList.add("sent"); p.lang = "fr";
    p.innerHTML = esc(q.before) + '<span class="blank">' + (q.mc ? "?" : "&nbsp;") + '</span>' + esc(q.after);
    hint = "„" + q.card.exRo + "”" + (q.verbHint ? " · verbul " + q.verbHint : "");
  } else if (q.type === "conj") {
    p.lang = "fr";
    p.innerHTML = esc(q.card.fr) + ' <span class="muted" style="font-weight:500">→ ' + esc(PRON[q.person]) + ' …</span>';
    hint = q.card.ro;
  }
  $("qHint").textContent = hint;
  $("qFb").innerHTML = "";
  if (q.mc) {
    $("qTypeBox").hidden = true;
    $("qOpts").hidden = false;
    $("qOpts").innerHTML = q.opts.map((o, i) => '<button type="button" class="opt" data-i="' + i + '"' + (q.type === "fr2ro" ? "" : ' lang="fr"') + '><kbd>' + (i + 1) + '</kbd><span>' + esc(o) + '</span></button>').join("");
    $("goBtn").hidden = true;
  } else {
    $("qOpts").hidden = true; $("qOpts").innerHTML = "";
    $("qTypeBox").hidden = false;
    const inp = $("qInput"); inp.value = ""; inp.className = "answer"; inp.disabled = false;
    inp.placeholder = q.type === "fr2ro" ? "Scrie în română…" : "Scrie în franceză…";
    $("accents").innerHTML = (q.type === "fr2ro" ? "ă â î ș ț" : "é è ê à â ç ù û ô î ï ë œ '").split(" ").map(ch => '<button type="button" tabindex="-1">' + ch + '</button>').join("");
    $("goBtn").hidden = false; $("goBtn").textContent = "Verifică";
    inp.focus({preventScroll: true});
  }
  $("skipBtn").hidden = false;
}
function correctText(q){
  if (q.type === "conj") return q.full;
  if (q.type === "blank") return q.before + q.answer + q.after;
  return q.answer;
}
function finishQ(ok, note, yours){
  answered = true;
  const q = test[qi];
  if (ok) score++; else wrong.push({q, yours});
  const c = q.card;
  let ex = "";
  if (q.type === "conj") ex = '<div class="ex" lang="fr">' + q.forms.map((f, i) => esc(withPron(f, i))).join(" · ") + '</div>';
  else if (q.type !== "blank" && q.type !== "sent") ex = '<div class="ex"><b lang="fr">' + esc(c.exFr) + '</b><br>' + esc(c.exRo) + '</div>';
  else ex = '<div class="ex"><b lang="fr">' + esc(c.fr) + '</b> = ' + esc(c.ro) + (q.type === "blank" ? '<br>' + esc(c.exRo) : "") + '</div>';
  $("qFb").innerHTML = '<div class="fb ' + (ok ? "right" : "wrong") + '" role="status"><strong class="v">' + (ok ? "Corect!" : "Greșit") + '</strong>' +
    (note ? '<span>' + esc(note) + '</span>' : "") +
    (!ok || note ? '<span>Răspuns corect: <b lang="fr">' + esc(correctText(q)) + '</b></span>' : "") + ex + '</div>';
  $("qScore").textContent = "Corecte: " + score;
  $("qBar").style.width = ((qi + 1) / test.length * 100) + "%";
  $("skipBtn").hidden = true;
  $("goBtn").hidden = false;
  $("goBtn").textContent = qi + 1 < test.length ? "Următoarea →" : "Vezi rezultatul";
  $("goBtn").focus({preventScroll: true});
}
function choose(i){
  const q = test[qi]; if (answered || !q.mc) return;
  const ok = q.opts[i] === q.answer;
  document.querySelectorAll("#qOpts .opt").forEach((b, j) => {
    b.disabled = true;
    if (q.opts[j] === q.answer) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
  });
  finishQ(ok, "", q.opts[i]);
}
function check(){
  const q = test[qi], inp = $("qInput");
  if (!inp.value.trim()) { inp.focus(); return; }
  const r = judge(inp.value, q.accept);
  inp.disabled = true; inp.classList.add(r ? "right" : "wrong");
  const note = r === "accents" ? "Atenție la accente / diacritice." : r === "typo" ? "Aproape: o mică greșeală de scriere." : "";
  finishQ(!!r, note, inp.value.trim());
}
function skip(){
  if (answered) return;
  const q = test[qi];
  if (q.mc) document.querySelectorAll("#qOpts .opt").forEach((b, j) => { b.disabled = true; if (q.opts[j] === q.answer) b.classList.add("right"); });
  else { $("qInput").disabled = true; $("qInput").classList.add("wrong"); }
  finishQ(false, "", "(nu știu)");
}
function advance(){
  if (qi + 1 < test.length) { qi++; renderQ(); } else results();
}
$("qOpts").onclick = e => { const b = e.target.closest(".opt"); if (b) choose(+b.dataset.i); };
$("goBtn").onclick = () => answered ? advance() : check();
$("skipBtn").onclick = skip;
$("quitBtn").onclick = () => { if (qi > 0 || answered) { test = test.slice(0, qi + (answered ? 1 : 0)); results(); } else { show("setup"); renderSetup(); } };
$("qInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); answered ? advance() : check(); } });
$("accents").addEventListener("mousedown", e => e.preventDefault());
$("accents").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const inp = $("qInput"); if (inp.disabled) return;
  const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
  inp.value = inp.value.slice(0, s) + b.textContent + inp.value.slice(en);
  inp.setSelectionRange(s + 1, s + 1); inp.focus();
};
document.addEventListener("keydown", e => {
  if ($("quiz").hidden || e.target.tagName === "INPUT") return;
  const q = test[qi];
  if (!answered && q.mc && /^[1-4]$/.test(e.key) && q.opts[+e.key - 1] != null) { e.preventDefault(); choose(+e.key - 1); }
  else if (answered && e.key === "Enter" && e.target !== $("goBtn")) { e.preventDefault(); advance(); }
});

// ---------- results ----------
function results(){
  const n = test.length, pct = n ? Math.round(score / n * 100) : 0;
  $("rScore").textContent = score + " / " + n;
  $("rPct").textContent = pct + "%";
  $("rMsg").textContent = pct === 100 ? "Perfect! Nicio greșeală." : pct >= 85 ? "Foarte bine!" : pct >= 60 ? "Bine. Mai repetă greșelile de mai jos." : "Mai exersează cu cartonașele, apoi reia testul.";
  if (n >= 10 && lastTest && lastTest.cats.size === 1) {
    const id = [...lastTest.cats][0];
    if (best[id] == null || pct > best[id]) { best[id] = pct; store.set("best", best); }
  }
  $("retryWrongBtn").hidden = !wrong.length;
  $("rListBox").hidden = !wrong.length;
  $("rList").innerHTML = wrong.map(w => {
    const q = w.q;
    let prompt = q.type === "blank" ? q.before + "___" + q.after : q.type === "conj" ? q.card.fr + " → " + PRON[q.person] : q.prompt;
    return '<li><span>' + esc(prompt) + '</span><span class="small">Tu: <span class="yours">' + esc(w.yours) + '</span></span><span class="small">Corect: <span class="good" lang="fr">' + esc(correctText(q)) + '</span></span></li>';
  }).join("");
  show("result");
}
$("retryWrongBtn").onclick = () => {
  const pool = CARDS.filter(c => lastTest.cats.has(c.cat));
  const t = shuffle(wrong.map(w => w.q));
  t.forEach(q => { if (q.mc) q.opts = shuffle(q.opts.slice()); });
  const keep = lastTest; start(t); lastTest = {...keep, cats: new Set()};  // a retry doesn't count as a record
};
$("againBtn").onclick = () => { const l = lastTest && lastTest.cats.size ? lastTest : {cats: selected, len, mode}; selected = new Set(l.cats); start(buildTest(l.cats, l.len, l.mode === "type")); };
$("setupBtn").onclick = () => { show("setup"); renderSetup(); };

renderSetup();
</script>
